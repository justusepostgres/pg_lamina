[package]
name = "pg_lamina"
version = "0.2.0"
edition = "2021"
rust-version = "1.94"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["pg17"]
pg17 = ["pgrx/pg17"]
pg_test = []

[dependencies]
pgrx = { version = "=0.16.1", default-features = false }
datafusion = { version = "=55.0.0", default-features = false, features = ["parquet", "string_expressions", "datetime_expressions", "regex_expressions", "sql"] }
datafusion-proto = "=55.0.0"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
object_store = "0.13.2"
bytes = "1"
url = "2"
serde_json = "1"
arrow-json = "59.2.0"
async-trait = "0.1"
futures = "0.3"

[profile.dev]
debug = 0

[profile.release]
debug = 0
codegen-units = 16
